<?xml version="1.0" encoding="UTF-8"?>
<!--
  ImagineCode — application mark
  ───────────────────────────────────────────────────────────────────────────
  An ink tile, a viewfinder frame, and the compiler spark blooming inside it.
  Same vocabulary as the IDE itself: ink-black surfaces, hairline geometry,
  one phosphor accent (#c6f24e). Detailed variant — rendered at 48px and up.
  The ≤32px variant lives in icon-small.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- the tile: lit from the top-left, falling away to near-black -->
    <linearGradient id="tile" x1="0.12" y1="0" x2="0.62" y2="1">
      <stop offset="0"    stop-color="#191922"/>
      <stop offset="0.42" stop-color="#0d0d12"/>
      <stop offset="1"    stop-color="#060609"/>
    </linearGradient>

    <!-- phosphor bloom behind the spark -->
    <radialGradient id="bloom" cx="0.5" cy="0.475" r="0.52">
      <stop offset="0"    stop-color="#c6f24e" stop-opacity="0.34"/>
      <stop offset="0.34" stop-color="#c6f24e" stop-opacity="0.13"/>
      <stop offset="0.72" stop-color="#c6f24e" stop-opacity="0.03"/>
      <stop offset="1"    stop-color="#c6f24e" stop-opacity="0"/>
    </radialGradient>

    <!-- the spark itself: hot core at the top, deeper phosphor at the tail -->
    <linearGradient id="spark" x1="0.24" y1="0" x2="0.78" y2="1">
      <stop offset="0"    stop-color="#f6ffdd"/>
      <stop offset="0.30" stop-color="#dcff77"/>
      <stop offset="0.68" stop-color="#c6f24e"/>
      <stop offset="1"    stop-color="#9bd016"/>
    </linearGradient>

    <linearGradient id="sparkSmall" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#eaffb4"/>
      <stop offset="1" stop-color="#b6e63a"/>
    </linearGradient>

    <!-- glass highlight running along the top edge of the tile -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="tightGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- ── tile ─────────────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bloom)"/>

    <!-- viewfinder frame: this is an IDE, and it is looking at something -->
    <g fill="none" stroke="#c6f24e" stroke-opacity="0.30" stroke-width="7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 96 196 L 96 132 Q 96 96 132 96 L 196 96"/>
      <path d="M 828 96 L 892 96 Q 928 96 928 132 L 928 196"/>
      <path d="M 928 828 L 928 892 Q 928 928 892 928 L 828 928"/>
      <path d="M 196 928 L 132 928 Q 96 928 96 892 L 96 828"/>
    </g>

    <!-- the compiler spark -->
    <g>
      <path d="M 512 234 Q 539.3 448.2 694 486 Q 539.3 523.8 512 738
               Q 484.7 523.8 330 486 Q 484.7 448.2 512 234 Z"
            fill="#c6f24e" fill-opacity="0.55" filter="url(#softGlow)"/>
      <path d="M 512 234 Q 539.3 448.2 694 486 Q 539.3 523.8 512 738
               Q 484.7 523.8 330 486 Q 484.7 448.2 512 234 Z"
            fill="url(#spark)"/>
    </g>

    <!-- the satellite: one imagination always makes another -->
    <g>
      <path d="M 726 636 Q 734.7 704 784 716 Q 734.7 728 726 796
               Q 717.3 728 668 716 Q 717.3 704 726 636 Z"
            fill="#c6f24e" fill-opacity="0.5" filter="url(#tightGlow)"/>
      <path d="M 726 636 Q 734.7 704 784 716 Q 734.7 728 726 796
               Q 717.3 728 668 716 Q 717.3 704 726 636 Z"
            fill="url(#sparkSmall)"/>
    </g>

    <!-- top rim highlight -->
    <path d="M 0 228 Q 0 0 228 0 L 796 0 Q 1024 0 1024 228"
          fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>

  <!-- outer hairline, the same one every surface in the IDE has -->
  <rect x="1.75" y="1.75" width="1020.5" height="1020.5" rx="226.5" ry="226.5"
        fill="none" stroke="#32323e" stroke-opacity="0.75" stroke-width="3.5"/>
</svg>
