# ═══════════════════════════════════════════════════════════════════
#  ImagineCode landing — nginx
#  Dropped in as /etc/nginx/conf.d/default.conf, so this file is read
#  inside the stock http{} block. That is why `map` is legal here.
# ═══════════════════════════════════════════════════════════════════

# Nothing in this site is content-hashed — it ships as css/style.css and
# js/main.js, the same two names on every deploy. A long max-age would
# pin returning visitors to whichever build they happened to see first,
# with no way to bust it. So: revalidate the markup and the code (one
# conditional request, answered with a 304), and cache only the images,
# which are the bulk of the bytes and the least likely to change.
map $uri $imaginecode_cache {
    default              "no-cache";
    "~*^/assets/"        "public, max-age=604800";
}

server {
    # 4321 rather than 80 — see the Dockerfile. A high port also means the
    # worker binds it without privileges.
    listen      4321;
    listen      [::]:4321;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset     utf-8;
    server_tokens off;

    # ── compression ──────────────────────────────────────────────────
    # The PNGs are already compressed; re-deflating them just burns CPU.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # ── headers ──────────────────────────────────────────────────────
    # Every add_header lives at server level on purpose. nginx does not
    # merge them: a single add_header inside any location block silently
    # drops every header inherited from here. Keeping them in one place
    # is what makes that impossible to get wrong later.
    add_header Cache-Control            $imaginecode_cache always;
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # style-src needs 'unsafe-inline': the hero's compiler animation paints
    # its colour swatches by writing style="color:#ff2e97" through innerHTML
    # (js/main.js), which counts as an inline style. script-src stays strict.
    # Fonts come from Google — the stylesheet from googleapis, the woff2
    # files from gstatic. The lone data: image is the grain overlay in the CSS.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
        always;

    # ── routing ──────────────────────────────────────────────────────
    # One page. The nav is all fragment links, so the server never sees
    # #download and friends; anything that does reach here is a typo or a
    # stale link, and the landing page is a better answer than nginx's
    # default 404 body.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Traefik and the container healthcheck hit this; it is deliberately
    # the one place with its own add_header, since it has no headers worth
    # inheriting.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
